services:
  - type: web
    name: minecraft-manager
    env: docker
    dockerfilePath: docker/controller.Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JAVA_MIN_MEMORY
        value: 512M
      - key: JAVA_MAX_MEMORY
        value: 1G
      - key: DATABASE_URL
        sync: false  # Configurar manualmente en Render Dashboard → Environment
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "3000"
      # PUBLIC_IP es detectado automáticamente desde RENDER_EXTERNAL_HOSTNAME
      # Solo necesitas definirlo manualmente si usas un dominio personalizado
