services:
  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: minecraft_manager
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: rootpassword
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  minecraft-controller:
    build:
      context: .
      dockerfile: docker/controller.Dockerfile
    ports:
      - "${BACKEND_PORT:-3000}:3000"
      - "${MINECRAFT_PORT:-25565}:25565"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      MINECRAFT_DIR: /minecraft/server
      PAPER_JAR: /minecraft/server/paper.jar
      JAVA_BIN: java
      JAVA_MIN_MEMORY: ${JAVA_MIN_MEMORY:-1G}
      JAVA_MAX_MEMORY: ${JAVA_MAX_MEMORY:-2G}
      LOG_BUFFER_SIZE: ${LOG_BUFFER_SIZE:-500}
      MINECRAFT_STOP_TIMEOUT_MS: ${MINECRAFT_STOP_TIMEOUT_MS:-30000}
      DATABASE_URL: mysql://root:root@mysql:3306/minecraft_manager
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: minecraft-backups
      S3_ACCESS_KEY: root
      S3_SECRET_KEY: rootpassword
    depends_on:
      - mysql
    restart: unless-stopped

volumes:
  mysql_data:
  minio_data:
