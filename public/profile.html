<!DOCTYPE html>
<html lang="es">
<head>
  <script>!function(){var t=localStorage.getItem("mc-theme")||"dark";document.documentElement.dataset.theme=t;document.documentElement.classList.add("no-transition")}();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Perfil - Minecraft Manager</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/js/components/index.js?v=3"></script>
  <script type="module" src="/js/components/UISidebar.js?v=3"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/skinview3d@3.0.0-alpha.1/bundles/skinview3d.bundle.js?v=3"></script>
  <script>
    window.addEventListener('load', () => {
      const loader = document.getElementById('initial-loader');
      if (loader) {
        loader.classList.add('fade-out');
        setTimeout(() => loader.remove(), 300);
      }
    });
  </script>
  <script type="module" src="/js/components/UIThemeToggle.js?v=3"></script>
</head>
<body>
  <div id="initial-loader" class="initial-loader">
    <div class="loader-spinner"></div>
    <div class="text">CARGANDO PERFIL...</div>
  </div>

  <!-- Sidebar Component -->
  <ui-sidebar type="main" active="profile"></ui-sidebar>
  <ui-sidebar type="profile" active="cuenta" id="profile-sidebar"></ui-sidebar>

  <!-- Content -->
  <div class="content" id="app-container">
    <div class="header" style="margin-bottom: 30px;">
      <div class="server-title">
        <h2>Mi Perfil</h2>
        <p>Configura tu cuenta y apariencia</p>
      </div>
    </div>

    <!-- Datos Personales -->
    <div class="card" style="max-width: 800px;">
      <h3><i data-lucide="settings"></i> Datos de la Cuenta</h3>
      <form id="profile-form" style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px;">
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <label style="font-weight: 500;">Nombre de Usuario:</label>
          <ui-input variant="command" id="username" placeholder="Tu usuario"></ui-input>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <label style="font-weight: 500;">Nueva Contraseña (opcional):</label>
          <ui-input variant="command" type="password" id="password" placeholder="***"></ui-input>
        </div>
        <div id="profile-msg" style="color: var(--color-success); font-weight: bold; display: none;"></div>
        <div style="margin-top: 10px;">
          <ui-button variant="blue" type="submit" id="btn-save-profile">Guardar Cambios</ui-button>
        </div>
      </form>
    </div>

  </div>

  <script type="module" src="/js/pages/profile.js?v=3"></script>
</body>
</html>
