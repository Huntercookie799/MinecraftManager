<!DOCTYPE html>
<html lang="es">
<head>
  <script>!function(){var t=localStorage.getItem("mc-theme")||"dark";document.documentElement.dataset.theme=t;document.documentElement.classList.add("no-transition")}();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Minecraft Manager</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/js/components/index.js?v=3"></script>
  <script type="module" src="/js/components/UISidebar.js?v=3"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    window.addEventListener('load', () => {
      const loader = document.getElementById('initial-loader');
      if (loader) {
        loader.classList.add('fade-out');
        setTimeout(() => loader.remove(), 300);
      }
    });
  </script>
  <script type="module" src="/js/components/UIThemeToggle.js?v=3"></script>
</head>
<body>
  <div id="initial-loader" class="initial-loader">
    <div class="loader-spinner"></div>
    <div class="text">SINTONIZANDO SERVIDORES...</div>
  </div>

  <!-- Sidebar Component -->
  <ui-sidebar type="main" active="dashboard"></ui-sidebar>

  <!-- Content -->
  <div class="content" id="dashboard-view">
    <div class="header" style="flex-wrap: wrap; gap: 15px; align-items: center; justify-content: space-between;">
      <div style="display: flex; align-items: center; gap: 15px; flex-wrap: wrap;">
        <h2 style="margin: 0;">Mis Servidores</h2>
        <div id="hostname-summary" style="display:flex; align-items:center; gap:10px;">
          <span class="status-badge offline" id="router-badge" style="display:inline-flex;">
            <div class="dot"></div><span class="text" id="router-badge-text">Cargando...</span>
          </span>
          <span id="lan-ip-chip" style="font-family:var(--font-mono); font-size:0.8rem; color:var(--text-dim); background:var(--bg-core); border:1px solid var(--border-color); padding:4px 10px; border-radius:var(--border-radius); display:none;"></span>
        </div>
      </div>
      <div style="display:flex; gap: 10px;">
        <ui-button variant="secondary" id="btn-show-compatibility" style="width: auto;">
          <i data-lucide="check-circle"></i>
          Consultar Compatibilidad
        </ui-button>
        <ui-button variant="success" id="btn-show-new-server" style="width: auto;">
          <i data-lucide="plus"></i>
          Nuevo Servidor
        </ui-button>
      </div>
    </div>

    <div id="ip-change-banner" style="display:none; margin-bottom:15px; padding:10px 14px; border:1px solid var(--color-warning, #eab308); border-radius:var(--border-radius); font-family:var(--font-mono); font-size:0.75rem; color:var(--color-warning, #eab308); background:rgba(234,179,8,0.08);"></div>
    
    <div id="hostnames-hint" style="display:none; margin-bottom:20px; padding:14px; border:1px dashed var(--border-color); border-radius:var(--border-radius); font-family:var(--font-mono); font-size:0.75rem; color:var(--text-dim);">
      <strong style="color:var(--text-main);">📋 Para configurar hostnames en cada PC de la LAN (archivo hosts):</strong><br>
      <span id="hosts-file-content"></span>
      <div style="margin-top:12px; display:flex; gap:10px; flex-wrap:wrap;">
        <button id="btn-download-hosts-script" class="btn-ghost" style="display:inline-flex; align-items:center; gap:6px;"><i data-lucide="download" style="width:14px;height:14px;"></i> Script para jugadores (.bat)</button>
        <button id="btn-download-hosts-auto" class="btn-ghost" style="display:inline-flex; align-items:center; gap:6px;"><i data-lucide="refresh-cw" style="width:14px;height:14px;"></i> Script AUTO-actualizable (.bat)</button>
      </div>
    </div>

    <ui-table>
      <table class="data-table">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Estado</th>
            <th>ID</th>
            <th>Versión</th>
            <th>Puerto</th>
            <th>Hostname</th>
            <th>Memoria</th>
            <th>Jugadores</th>
            <th style="text-align: right;">Acciones</th>
          </tr>
        </thead>
        <tbody id="servers-list">
          <!-- Los servidores se cargarán aquí -->
        </tbody>
      </table>
    </ui-table>
  </div>





  <script type="module" src="/js/pages/dashboard.js?v=3"></script>
</body>
</html>
