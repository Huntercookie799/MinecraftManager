<!DOCTYPE html>
<html lang="es">
<head>
  <script>!function(){var t=localStorage.getItem("mc-theme")||"dark";document.documentElement.dataset.theme=t;document.documentElement.classList.add("no-transition")}();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consola del Servidor - Minecraft Manager</title>
  <meta name="description" content="Gestiona la consola y jugadores en línea de tu servidor de Minecraft.">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/js/components/index.js?v=3"></script>
  <script type="module" src="/js/components/UISidebar.js?v=3"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    window.addEventListener('load', () => {
      const loader = document.getElementById('initial-loader');
      if (loader) {
        loader.classList.add('fade-out');
        setTimeout(() => loader.remove(), 300);
      }
    });
  </script>
  <script type="module" src="/js/components/UIThemeToggle.js?v=3"></script>
  
  <style>

    
    /* Spinner de carga para el historial */
    .history-spinner {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      gap: 20px;
    }
    
    .history-spinner.active {
      display: flex;
    }
    
    .history-spinner .spinner-ring {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border-color);
      border-top-color: #4f8cf7;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    /* Contenedor de la terminal con posición relativa */
    .terminal-container {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: var(--terminal-bg, #0a0a0a);
      border-radius: var(--border-radius);
      overflow: hidden;
    }

    /* Terminal output */
    .terminal {
      flex: 1;
      background: var(--terminal-bg, #0a0a0a);
      color: #e0e0e0;
      font-family: var(--font-mono, 'Courier New', monospace);
      font-size: 0.85rem;
      padding: 16px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
      line-height: 1.6;
      border-radius: var(--border-radius);
    }
    
    /* Personalizar scrollbar */
    .terminal::-webkit-scrollbar {
      width: 8px;
    }
    
    .terminal::-webkit-scrollbar-track {
      background: #1a1a1a;
    }
    
    .terminal::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 4px;
    }
    
    .terminal::-webkit-scrollbar-thumb:hover {
      background: #444;
    }
    
    /* Líneas de la terminal */
    .terminal-line {
      padding: 2px 0;
      opacity: 0.9;
    }
    
    .terminal-line.warn {
      color: #facc15;
    }
    
    .terminal-line.error {
      color: #ef4444;
    }
    
    .terminal-line.info {
      color: #4f8cf7;
    }
    
    .terminal-line.success {
      color: #4ade80;
    }
    
    /* Badge de estado del WebSocket */
    .ws-status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 12px;
      background: var(--bg-secondary, #1a1a1a);
      border-radius: 20px;
      border: 1px solid var(--border-color, #333);
      font-size: 0.75rem;
      font-family: var(--font-mono, monospace);
    }
    
    .ws-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    
    .ws-dot-on {
      background: #4ade80;
      box-shadow: 0 0 8px rgba(74, 222, 128, 0.4);
    }
    
    .ws-dot-off {
      background: #ef4444;
      animation: pulse-dot 1.5s ease-in-out infinite;
    }
    
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    
    /* Banner de inicio del servidor */
    .console-starting {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 12px;
      background: rgba(74, 222, 128, 0.05);
      border-bottom: 1px solid rgba(74, 222, 128, 0.1);
      font-family: var(--font-mono, monospace);
      color: #4ade80;
      font-size: 0.85rem;
    }
    
    .console-starting.active {
      display: flex;
    }
    
    .console-starting .spinner-inline {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(74, 222, 128, 0.2);
      border-top-color: #4ade80;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div id="initial-loader" class="initial-loader">
    <div class="loader-spinner"></div>
    <div class="text">CARGANDO CONSOLA...</div>
  </div>

  <!-- Sidebar Component -->
  <ui-sidebar type="main" active="dashboard"></ui-sidebar>
  <ui-sidebar type="server" active="console"></ui-sidebar>

  <!-- Content -->
  <div class="content" id="app-container">
    
    <!-- Header General -->
    <div class="header">
      <div class="server-title">
        <h2 id="current-server-name"><span class="skeleton skeleton-title"></span></h2>
        <p id="current-server-info"><span class="skeleton skeleton-sub"></span></p>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
        <!-- World Exists Indicator -->
        <div id="world-exists-badge" class="world-exists-badge" style="display:none;">
          <span id="world-exists-icon">🌍</span>
          <span id="world-exists-label">Mundo generado</span>
        </div>
        <!-- World Time Indicator -->
        <div id="world-time-indicator" class="world-time-badge" style="display: none;">
          <div class="time-icon-wrap" id="time-icon-wrap">
            <span class="time-icon" id="time-icon">☀️</span>
          </div>
          <div class="time-info">
            <span class="time-label" id="time-label">Día</span>
            <span class="time-value" id="time-value">06:00</span>
          </div>
        </div>
        <div id="status-badge" class="status-badge offline">
          <div class="dot"></div>
          <span id="status-text" class="text">OFFLINE</span>
        </div>
      </div>
    </div>

    <!-- Vista: Consola -->
    <div id="view-console" class="tab-content active" style="flex: 1; display: flex; flex-direction: column; overflow: hidden;">
      
      <!-- Consola -->
      <div class="card console-card" style="flex: 1; display: flex; flex-direction: column; overflow: hidden; min-height: 0;">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
          <h3 style="margin: 0; padding: 0; border: none; display: flex; align-items: center; gap: 10px;">
            <i data-lucide="terminal" style="width:20px;height:20px;"></i>
            Terminal del Servidor
          </h3>
          <div class="storage-toggle" style="display: flex; background: #000; border: 1px solid var(--border-color); border-radius: var(--border-radius); padding: 2px;">
            <ui-button variant="toggle" accent="success" active id="btn-console-live">EN VIVO</ui-button>
            <ui-button variant="toggle" accent="warning" id="btn-console-history">HISTORIAL (BD)</ui-button>
          </div>
          <div class="ws-status-badge" id="ws-status-badge">
            <span class="ws-dot ws-dot-off" id="ws-status-dot"></span>
            <span class="ws-status-label" id="ws-status-label">Conectando...</span>
          </div>
        </div>
        
        <!-- Banner de inicio del servidor -->
        <div id="console-starting" class="console-starting">
          <span class="spinner-inline"></span>
          Iniciando servidor...
        </div>
        
        <!-- Terminal Container -->
        <div class="terminal-container" id="terminal-container">
          
          <!-- Output de la terminal -->
          <div id="terminal-output" class="terminal"></div>
        </div>
        
        <!-- Contenedor del Historial -->
        <div class="history-container" id="history-container" style="display: none; flex: 1; flex-direction: column; min-height: 0; overflow: hidden;">
          
          <div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px;">
            <div style="display: flex; gap: 10px; align-items: stretch;">
              <div id="history-search-container" style="flex: 1; display: flex; align-items: center; background: var(--input-bg, #1a1a1a); border: 1px solid var(--border-color, #333); border-radius: var(--border-radius, 8px); padding: 4px 12px; gap: 6px; flex-wrap: wrap; transition: border-color 0.2s;">
                <div id="history-search-chips" style="display: flex; gap: 6px; flex-wrap: wrap;"></div>
                <input type="text" id="history-search-input" placeholder="Buscar en el historial (palabra clave, jugador)..." style="flex: 1; min-width: 200px; background: transparent !important; border: none !important; box-shadow: none !important; outline: none !important; color: var(--text-color, #e0e0e0) !important; font-family: inherit; font-size: 0.9rem; padding: 6px 0; margin: 0;">
              </div>
              <ui-button variant="primary" id="btn-history-search" style="width: auto; white-space: nowrap; padding: 0 16px;"><i data-lucide="search" style="width: 16px; height: 16px;"></i> Buscar</ui-button>
            </div>
            <div style="font-size: 0.75rem; color: var(--text-dim); opacity: 0.8; margin-top: -2px;">💡 Presiona <b style="color:var(--text-color);">Ctrl + Enter</b> para agregar múltiples filtros y buscar por todos a la vez.</div>
          </div>

          <div id="history-spinner" class="history-spinner">
            <div class="spinner-ring"></div>
            <p style="font-family: var(--font-mono); color: var(--text-dim);">Cargando historial...</p>
          </div>
          <div id="history-table-wrapper" style="flex: 1; overflow-y: auto; display: none; background: var(--terminal-bg, #0a0a0a); border-radius: var(--border-radius); margin-top: 10px;">
            <!-- Terminal view will be injected here -->
          </div>
          <div id="history-pagination" style="display: flex; justify-content: space-between; gap: 15px; align-items: center; margin-top: 15px;">
            <ui-button variant="secondary" size="sm" id="btn-history-prev" disabled style="width: 100px;">Anterior</ui-button>
            <span id="history-page-info" style="font-family: var(--font-mono); font-size: 0.9rem; color: var(--text-dim); flex: 1; text-align: center;">Página 1 / 1</span>
            <ui-button variant="secondary" size="sm" id="btn-history-next" disabled style="width: 100px;">Siguiente</ui-button>
          </div>
        </div>
        
        <!-- Comando Input con autocompletado estilo Minecraft -->
        <div class="command-input" id="command-input-row">
          <div id="cmd-suggestions" class="cmd-suggestions" style="display: none;"></div>
          <ui-input variant="command" id="command-input" placeholder="Escribe un comando (ej. /say Hola) — Tab para autocompletar" disabled></ui-input>
          <ui-button variant="blue" id="btn-send-command" disabled style="width: auto; display: flex; align-items: center; gap: 8px;">
            <i data-lucide="send"></i> Enviar
          </ui-button>
        </div>
      </div>
      
    </div>
  </div>

  <script type="module" src="/js/pages/server-console.js?v=3"></script>
</body>
</html>
