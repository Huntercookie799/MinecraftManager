<!DOCTYPE html>
<html lang="es">
<head>
  <script>!function(){var t=localStorage.getItem("mc-theme")||"dark";document.documentElement.dataset.theme=t;document.documentElement.classList.add("no-transition")}();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mundos del Servidor - Minecraft Manager</title>
  <meta name="description" content="Gestiona los mundos de tu servidor de Minecraft.">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/js/components/index.js"></script>
  <script type="module" src="/js/components/UISidebar.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    window.addEventListener('load', () => {
      const loader = document.getElementById('initial-loader');
      if (loader) {
        loader.classList.add('fade-out');
        setTimeout(() => loader.remove(), 300);
      }
    });
  </script>
  <script type="module" src="/js/components/UIThemeToggle.js"></script>
</head>
<body>
  <div id="initial-loader" class="initial-loader">
    <div class="loader-spinner"></div>
    <div class="text">CARGANDO MUNDOS...</div>
  </div>

  <!-- Sidebar Component -->
  <ui-sidebar type="main" active="dashboard"></ui-sidebar>
  <ui-sidebar type="server" active="worlds"></ui-sidebar>

  <!-- Content -->
  <div class="content" id="app-container">
    
    <!-- Header General -->
    <div class="header">
      <div class="server-title">
        <h2 id="current-server-name">Cargando...</h2>
        <p id="current-server-info">Puerto: -- | RAM: --</p>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
        <!-- World Exists Indicator -->
        <div id="world-exists-badge" class="world-exists-badge" style="display:none;">
          <span id="world-exists-icon">🌍</span>
          <span id="world-exists-label">Mundo generado</span>
        </div>
        <!-- World Time Indicator -->
        <div id="world-time-indicator" class="world-time-badge" style="display: none;">
          <div class="time-icon-wrap" id="time-icon-wrap">
            <span class="time-icon" id="time-icon">☀️</span>
          </div>
          <div class="time-info">
            <span class="time-label" id="time-label">Día</span>
            <span class="time-value" id="time-value">06:00</span>
          </div>
        </div>
        <div id="status-badge" class="status-badge offline">
          <div class="dot"></div>
          <span id="status-text" class="text">OFFLINE</span>
        </div>
      </div>
    </div>

    <!-- Vista: Mundos -->
    <div id="view-worlds" class="tab-content active">
      <div class="cards-grid">
        <div class="card" style="grid-column: 1 / -1;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h3 style="margin: 0; padding: 0; border: none;">Gestión de Mundos</h3>
            <ui-button variant="success" id="btn-show-new-world" style="width: auto;"><i data-lucide="plus"></i> Crear Nuevo Mundo</ui-button>
          </div>
          <div id="worlds-list" class="worlds-grid"></div>
        </div>
      </div>
    </div>

  </div>

  <!-- Modal Nuevo Mundo -->
  <ui-modal id="new-world-modal" title="Crear Nuevo Mundo" style="display: none;">
    <div class="command-input" style="flex-direction: column;">
      <label>Nombre del Mundo:</label>
      <ui-input variant="command" id="new-world-name" placeholder="Ej. skyblock_world"></ui-input>
      <div class="button-group" style="flex-direction: row; gap: 10px; margin-top: 15px;">
        <ui-button variant="secondary" id="btn-cancel-new-world">Cancelar</ui-button>
        <ui-button variant="success" id="btn-create-world">Crear</ui-button>
      </div>
    </div>
  </ui-modal>

  <script type="module" src="/js/pages/server-worlds.js"></script>
</body>
</html>
