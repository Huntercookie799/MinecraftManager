<!DOCTYPE html>
<html lang="es">
<head>
  <script>!function(){var t=localStorage.getItem("mc-theme")||"dark";document.documentElement.dataset.theme=t;document.documentElement.classList.add("no-transition")}();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jugadores del Servidor - Minecraft Manager</title>
  <meta name="description" content="Gestiona los jugadores en línea de tu servidor de Minecraft.">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/js/components/index.js?v=3"></script>
  <script type="module" src="/js/components/UISidebar.js?v=3"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/skinview3d@3.0.0-alpha.1/bundles/skinview3d.bundle.js?v=3"></script>
  <script>
    window.addEventListener('load', () => {
      const loader = document.getElementById('initial-loader');
      if (loader) {
        loader.classList.add('fade-out');
        setTimeout(() => loader.remove(), 300);
      }
    });
  </script>
  <script type="module" src="/js/components/UIThemeToggle.js?v=3"></script>
</head>
<body>
  <div id="initial-loader" class="initial-loader">
    <div class="loader-spinner"></div>
    <div class="text">CARGANDO JUGADORES...</div>
  </div>

  <!-- Sidebar Component -->
  <ui-sidebar type="main" active="dashboard"></ui-sidebar>
  <ui-sidebar type="server" active="players"></ui-sidebar>

  <!-- Content -->
  <div class="content" id="app-container">
    
    <!-- Header General -->
    <div class="header">
      <div class="server-title">
        <h2 id="current-server-name"><span class="skeleton skeleton-title"></span></h2>
        <p id="current-server-info"><span class="skeleton skeleton-sub"></span></p>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
        <!-- World Exists Indicator -->
        <div id="world-exists-badge" class="world-exists-badge" style="display:none;">
          <span id="world-exists-icon">🌍</span>
          <span id="world-exists-label">Mundo generado</span>
        </div>
        <!-- World Time Indicator -->
        <div id="world-time-indicator" class="world-time-badge" style="display: none;">
          <div class="time-icon-wrap" id="time-icon-wrap">
            <span class="time-icon" id="time-icon">☀️</span>
          </div>
          <div class="time-info">
            <span class="time-label" id="time-label">Día</span>
            <span class="time-value" id="time-value">06:00</span>
          </div>
        </div>
        <div id="status-badge" class="status-badge offline">
          <div class="dot"></div>
          <span id="status-text" class="text">OFFLINE</span>
        </div>
      </div>
    </div>

    <!-- Vista: Jugadores -->
    <div id="view-players" class="tab-content active" style="flex: 1; display: flex;">
      
      <!-- Panel de Jugadores en Línea -->
      <div class="card players-card" id="players-card" style="flex: 1;">
        <div class="players-card-header">
          <h3><i data-lucide="users" style="width:20px;height:20px;"></i> Jugadores en Línea</h3>
          <span class="players-count-badge" id="players-count-badge"><span class="skeleton skeleton-count"></span></span>
        </div>
        <div id="players-list" class="players-list">
          <div id="players-skeleton" class="players-skeleton">
            <div class="player-row player-row-skeleton">
              <div class="skeleton skeleton-avatar"></div>
              <div class="skeleton-slot">
                <div class="skeleton skeleton-line skeleton-line-name"></div>
                <div class="skeleton skeleton-line skeleton-line-sub"></div>
              </div>
              <div class="skeleton skeleton-badge"></div>
            </div>
            <div class="player-row player-row-skeleton">
              <div class="skeleton skeleton-avatar"></div>
              <div class="skeleton-slot">
                <div class="skeleton skeleton-line skeleton-line-name"></div>
                <div class="skeleton skeleton-line skeleton-line-sub"></div>
              </div>
              <div class="skeleton skeleton-badge"></div>
            </div>
            <div class="player-row player-row-skeleton">
              <div class="skeleton skeleton-avatar"></div>
              <div class="skeleton-slot">
                <div class="skeleton skeleton-line skeleton-line-name"></div>
                <div class="skeleton skeleton-line skeleton-line-sub"></div>
              </div>
              <div class="skeleton skeleton-badge"></div>
            </div>
          </div>
          <div class="players-empty" id="players-empty" style="display:none;">
            <span class="players-empty-icon">🎮</span>
            <p>No hay jugadores en línea</p>
          </div>
        </div>
      </div>

      <!-- Panel del Historial Completo -->
      <div class="card players-card" id="registry-card" style="flex: 1; margin-top: 20px;">
        <div class="players-card-header" style="display: flex; justify-content: space-between; align-items: center;">
          <h3><i data-lucide="database" style="width:20px;height:20px;"></i> Registro Histórico</h3>
          <span class="players-count-badge" id="registry-count-badge">0</span>
        </div>
        <div id="registry-list" class="players-list" style="max-height: 400px; overflow-y: auto;">
          <div class="players-empty" id="registry-empty" style="display:none;">
            <span class="players-empty-icon">📂</span>
            <p>No hay registros guardados</p>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Modal de Detalle de Jugador -->
  <ui-modal id="player-detail-modal" title="Detalle del Jugador" width="450px" style="display: none;">
    <div style="display: flex; flex-direction: column; gap: 20px;">
      
      <!-- Fila superior: Info básica -->
      <div style="display: flex; align-items: center; gap: 15px; background: var(--bg-core); padding: 15px; border-radius: var(--border-radius); border: 1px solid var(--border-color);">
        <img id="detail-avatar" src="" style="width: 60px; height: 60px; border-radius: 8px; image-rendering: pixelated; flex-shrink: 0;" />
        <div style="flex: 1;">
          <h3 id="detail-name" style="margin: 0; font-size: 1.4rem;">...</h3>
          <p id="detail-status" style="margin: 5px 0 0 0; font-size: 0.9rem; color: var(--text-dim);">Offline</p>
        </div>
      </div>

      <div style="display: flex; gap: 20px; align-items: flex-start;">
        <!-- Lado izquierdo: Skin 3D -->
        <div style="text-align: center; flex-shrink: 0;">
          <div id="detail-skin-viewer" style="width: 150px; height: 250px; background: #111; border-radius: var(--border-radius); border: 1px solid var(--border-color); overflow: hidden;"></div>
        </div>

        <!-- Lado derecho: Métricas -->
        <div style="flex: 1; display: flex; flex-direction: column; gap: 15px;">
          <div class="metric-box" style="background: var(--bg-core); padding: 12px; border-radius: 6px; border: 1px solid var(--border-color);">
            <div style="font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; margin-bottom: 4px;">Tiempo de Juego Total</div>
            <div id="detail-playtime" style="font-size: 1.1rem; font-weight: bold; color: var(--color-primary);">0s</div>
          </div>
          
          <div class="metric-box" style="background: var(--bg-core); padding: 12px; border-radius: 6px; border: 1px solid var(--border-color);">
            <div style="font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; margin-bottom: 4px;">Ubicación Actual</div>
            <div id="detail-coords" style="font-size: 0.9rem; font-family: monospace;">Desconocido</div>
            <div id="detail-dim" style="font-size: 0.85rem; margin-top: 4px; color: var(--text-dim);"></div>
          </div>

          <div class="metric-box" style="background: var(--bg-core); padding: 12px; border-radius: 6px; border: 1px solid var(--border-color);">
            <div style="font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; margin-bottom: 4px;">Última Vez Visto</div>
            <div id="detail-lastseen" style="font-size: 0.9rem;">-</div>
          </div>
        </div>
      </div>

    </div>
  </ui-modal>

  <script type="module" src="/js/pages/server-players.js?v=3"></script>
</body>
</html>
