<!DOCTYPE html>
<html lang="es">
<head>
  <script>!function(){var t=localStorage.getItem("mc-theme")||"dark";document.documentElement.dataset.theme=t;document.documentElement.classList.add("no-transition")}();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archivos del Servidor - Minecraft Manager</title>
  <meta name="description" content="Gestiona los archivos de tu servidor de Minecraft.">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/js/components/index.js?v=3"></script>
  <script type="module" src="/js/components/UISidebar.js?v=3"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    window.addEventListener('load', () => {
      const loader = document.getElementById('initial-loader');
      if (loader) { loader.classList.add('fade-out'); setTimeout(() => loader.remove(), 300); }
      if (window.lucide) lucide.createIcons();
    });
  </script>
  <script type="module" src="/js/components/UIThemeToggle.js?v=3"></script>
</head>
<body>
  <div id="initial-loader" class="initial-loader">
    <div class="loader-spinner"></div>
    <div class="text">CARGANDO ARCHIVOS...</div>
  </div>

  <ui-sidebar type="main" active="dashboard"></ui-sidebar>
  <ui-sidebar type="server" active="files"></ui-sidebar>

  <div class="content" id="app-container">

    <!-- Header -->
    <div class="header">
      <div class="server-title">
        <h2 id="current-server-name"><span class="skeleton skeleton-title"></span></h2>
        <p id="current-server-info"><span class="skeleton skeleton-sub"></span></p>
      </div>
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
        <div id="status-badge" class="status-badge offline">
          <div class="dot"></div>
          <span id="status-text" class="text">Cargando...</span>
        </div>
      </div>
    </div>

    <!-- Explorador de Archivos -->
    <div class="card fm-card">

      <!-- Toolbar -->
      <div class="fm-toolbar">
        <!-- Izquierda: breadcrumb -->
        <div class="fm-breadcrumb-wrap">
          <button id="fm-btn-up" class="fm-icon-btn" title="Subir directorio" disabled>
            <i data-lucide="arrow-left" style="width:15px;height:15px;"></i>
          </button>
          <nav id="fm-breadcrumb" class="fm-breadcrumb" aria-label="Ruta actual">
            <span class="fm-bread-item fm-bread-root" data-path=".">
              <i data-lucide="server" style="width:13px;height:13px;"></i> Raíz
            </span>
          </nav>
        </div>

        <!-- Derecha: acciones -->
        <div class="fm-toolbar-actions">
          <!-- Botón eliminar selección (aparece cuando hay selección) -->
          <button id="fm-btn-delete-sel" class="fm-action-btn danger" style="display:none;" title="Eliminar seleccionados">
            <i data-lucide="trash-2" style="width:15px;height:15px;"></i>
            <span id="fm-sel-count">0</span> seleccionados
          </button>
          <!-- Storage toggle -->
          <div class="fm-storage-toggle">
            <button id="btn-storage-local" class="fm-toggle-btn active" data-storage="local">
              <i data-lucide="hard-drive" style="width:13px;height:13px;"></i> Local
            </button>
            <button id="btn-storage-r2" class="fm-toggle-btn" data-storage="r2">
              <i data-lucide="cloud" style="width:13px;height:13px;"></i> R2
            </button>
          </div>
        </div>
      </div>

      <!-- Tabla de archivos -->
      <div class="fm-table-wrap">
        <table class="fm-table" id="fm-table">
          <thead>
            <tr>
              <th class="fm-col-check">
                <input type="checkbox" id="fm-check-all" title="Seleccionar todos">
              </th>
              <th class="fm-col-icon"></th>
              <th class="fm-col-name">Nombre</th>
              <th class="fm-col-size">Tamaño</th>
              <th class="fm-col-date">Modificado</th>
              <th class="fm-col-actions">Acciones</th>
            </tr>
          </thead>
          <tbody id="fm-tbody">
            <tr>
              <td colspan="6" class="fm-loading-cell">
                <div class="fm-loading">
                  <div class="files-spinner"></div>
                  <span>Cargando archivos...</span>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Footer: info selección + ruta actual -->
      <div class="fm-footer">
        <span id="fm-footer-info" class="fm-footer-info">—</span>
      </div>
    </div>

  </div>

  <!-- ── Modal: Editor de texto ── -->
  <div id="fm-editor-overlay" class="fm-editor-overlay" style="display:none;" role="dialog" aria-modal="true">
    <div class="fm-editor-panel">
      <div class="fm-editor-header">
        <div class="fm-editor-title">
          <i data-lucide="file-text" style="width:16px;height:16px;"></i>
          <span id="fm-editor-filename">archivo.yml</span>
        </div>
        <div style="display:flex;gap:8px;align-items:center;">
          <span id="fm-editor-status" class="fm-editor-status"></span>
          <button id="fm-editor-save" class="fm-editor-btn primary">
            <i data-lucide="save" style="width:14px;height:14px;"></i> Guardar
          </button>
          <button id="fm-editor-close" class="fm-editor-btn">
            <i data-lucide="x" style="width:14px;height:14px;"></i>
          </button>
        </div>
      </div>
      <textarea id="fm-editor-content" class="fm-editor-textarea" spellcheck="false" autocorrect="off" autocapitalize="off"></textarea>
    </div>
  </div>

  <script type="module" src="/js/pages/server-files.js?v=3"></script>
</body>
</html>
