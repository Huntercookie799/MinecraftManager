<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Manager - Login</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  
  <div id="login-screen" class="login-screen">
    <div class="login-box">
      <h2>Iniciar Sesión</h2>
      <p>Panel de Administración</p>
      <form id="login-form">
        <input type="text" id="username" placeholder="Usuario" required autocomplete="username">
        <input type="password" id="password" placeholder="Contraseña" required autocomplete="current-password">
        <!-- Uso de nuestro nuevo componente Web: -->
        <ui-button variant="blue" type="submit" id="btn-login">Entrar</ui-button>
      </form>
      <div id="login-error" class="login-error" style="display: none;"></div>
      <p style="margin-top: 20px; font-size: 0.9rem;">
        <a href="#" id="toggle-register" style="color: var(--color-blue); text-decoration: none;">¿No tienes cuenta? Regístrate</a>
      </p>
    </div>
  </div>

  <script type="module" src="/js/pages/login.js"></script>
</body>
</html>
