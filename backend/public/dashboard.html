<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Minecraft Manager</title>
  <link rel="stylesheet" href="/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="logo-area">
      <h1>Minecraft <span>Manager</span></h1>
    </div>
    <ul class="nav">
      <li class="active"><a href="/dashboard.html" style="display: flex; align-items: center; gap: 8px;"><i data-lucide="server" style="width: 18px; height: 18px;"></i> Mis Servidores</a></li>
      <li><a href="/profile.html" style="display: flex; align-items: center; gap: 8px;"><i data-lucide="user" style="width: 18px; height: 18px;"></i> Mi Perfil</a></li>
      <li><a href="#" id="btn-logout" style="color: var(--color-danger); display: flex; align-items: center; gap: 8px;"><i data-lucide="log-out" style="width: 18px; height: 18px;"></i> Cerrar Sesión</a></li>
    </ul>
  </div>

  <!-- Content -->
  <div class="content" id="dashboard-view">
    <div class="header" style="justify-content: space-between;">
      <h2>Mis Servidores</h2>
      <ui-button variant="success" id="btn-show-new-server" style="width: auto;">
        <i data-lucide="plus"></i>
        Nuevo Servidor
      </ui-button>
    </div>
    <div id="servers-list" class="cards-grid">
      <!-- Los servidores se cargarán aquí -->
    </div>
  </div>

  <!-- Modal para Nuevo Servidor -->
  <div id="new-server-modal" class="login-screen" style="display: none;">
    <div class="login-box">
      <h3>Crear Nuevo Servidor</h3>
      <div style="flex-direction: column; text-align: left;">
        <label>Nombre:</label>
        <input type="text" id="new-server-name" placeholder="Ej. MiServidorSurvival">
        <label>Memoria (Ej. 2G, 4G):</label>
        <input type="text" id="new-server-memory" value="2G">
        <label>Puerto (Opcional):</label>
        <input type="number" id="new-server-port" placeholder="Automático">
        
        <div style="display: flex; gap: 10px; margin-top: 20px;">
          <ui-button variant="secondary" id="btn-cancel-new-server">Cancelar</ui-button>
          <ui-button variant="success" id="btn-create-server">Crear Servidor</ui-button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/js/pages/dashboard.js"></script>
</body>
</html>
